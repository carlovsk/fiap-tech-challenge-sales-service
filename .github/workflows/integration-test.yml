name: Integration Tests

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start test environment
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."

      - name: Wait for application to be healthy
        run: |
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if docker compose -f docker-compose.test.yml exec -T app wget -q --spider http://localhost:3001/health 2>/dev/null; then
              echo "✅ Application is healthy!"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Application failed to become healthy"
              docker compose -f docker-compose.test.yml logs app
              exit 1
            fi
            
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - waiting for service..."
            sleep 2
          done

      - name: Run k6 integration tests
        id: k6
        run: |
          set -o pipefail
          # Run k6 and capture output, preserving exit code through pipe
          k6 run k6/integration-tests.js --out json=k6-results.json 2>&1 | tee k6-output.txt
          K6_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$K6_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $K6_EXIT_CODE

      - name: Parse k6 results
        id: parse
        if: always()
        run: |
          # Extract check results from output
          if [ -f k6-output.txt ]; then
            # Extract individual test results
            HEALTH_CHECK=$(grep -q "Health check passed" k6-output.txt && echo "✅" || echo "❌")
            SYNC_CREATE=$(grep -q "Vehicle synced (created)" k6-output.txt && echo "✅" || echo "❌")
            GET_AVAILABLE=$(grep -q "Get available vehicles passed" k6-output.txt && echo "✅" || echo "❌")
            GET_SOLD_BEFORE=$(grep -q "Get sold vehicles (before purchase) passed" k6-output.txt && echo "✅" || echo "❌")
            PURCHASE=$(grep -q "Purchase completed with paymentCode" k6-output.txt && echo "✅" || echo "❌")
            GET_AVAILABLE_AFTER=$(grep -q "Get available vehicles (after purchase) passed" k6-output.txt && echo "✅" || echo "❌")
            GET_SOLD_AFTER=$(grep -q "Get sold vehicles (after purchase) passed" k6-output.txt && echo "✅" || echo "❌")
            PAYMENT_CONFIRM=$(grep -q "Payment webhook (confirm) passed" k6-output.txt && echo "✅" || echo "❌")
            PAYMENT_INVALID=$(grep -q "Payment webhook (invalid code) correctly returned 404" k6-output.txt && echo "✅" || echo "❌")
            PURCHASE_NOT_FOUND=$(grep -q "Purchase (vehicle not found) correctly returned 404" k6-output.txt && echo "✅" || echo "❌")
            PURCHASE_NOT_AVAILABLE=$(grep -q "Purchase (vehicle not available) correctly returned 400" k6-output.txt && echo "✅" || echo "❌")
            PURCHASE_VALIDATION=$(grep -q "Purchase (validation error) correctly returned 400" k6-output.txt && echo "✅" || echo "❌")
            SYNC_VALIDATION=$(grep -q "Sync validation error correctly returned 400" k6-output.txt && echo "✅" || echo "❌")
            ALL_PASSED=$(grep -q "All integration tests passed" k6-output.txt && echo "true" || echo "false")
            
            # Save to outputs
            echo "health_check=$HEALTH_CHECK" >> $GITHUB_OUTPUT
            echo "sync_create=$SYNC_CREATE" >> $GITHUB_OUTPUT
            echo "get_available=$GET_AVAILABLE" >> $GITHUB_OUTPUT
            echo "get_sold_before=$GET_SOLD_BEFORE" >> $GITHUB_OUTPUT
            echo "purchase=$PURCHASE" >> $GITHUB_OUTPUT
            echo "get_available_after=$GET_AVAILABLE_AFTER" >> $GITHUB_OUTPUT
            echo "get_sold_after=$GET_SOLD_AFTER" >> $GITHUB_OUTPUT
            echo "payment_confirm=$PAYMENT_CONFIRM" >> $GITHUB_OUTPUT
            echo "payment_invalid=$PAYMENT_INVALID" >> $GITHUB_OUTPUT
            echo "purchase_not_found=$PURCHASE_NOT_FOUND" >> $GITHUB_OUTPUT
            echo "purchase_not_available=$PURCHASE_NOT_AVAILABLE" >> $GITHUB_OUTPUT
            echo "purchase_validation=$PURCHASE_VALIDATION" >> $GITHUB_OUTPUT
            echo "sync_validation=$SYNC_VALIDATION" >> $GITHUB_OUTPUT
            echo "all_passed=$ALL_PASSED" >> $GITHUB_OUTPUT
            
            # Save full output for details
            {
              echo "output<<EOF"
              cat k6-output.txt
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

      - name: Create or update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- integration-test-results-sales -->
            ## 🔗 Integration Test Results - vehicle-sales-service
            
            **Status:** ${{ steps.parse.outputs.all_passed == 'true' && '✅ All Tests Passed' || '❌ Some Tests Failed' }}
            
            ### Test Scenarios
            
            | Test | Status |
            |------|--------|
            | Health Check (`GET /health`) | ${{ steps.parse.outputs.health_check }} |
            | **Internal API** | |
            | Sync Vehicle - Create (`POST /api/internal/vehicles/sync`) | ${{ steps.parse.outputs.sync_create }} |
            | Sync Vehicle - Validation Error | ${{ steps.parse.outputs.sync_validation }} |
            | **Sales API** | |
            | Get Available Vehicles (`GET /api/sales/vehicles/available`) | ${{ steps.parse.outputs.get_available }} |
            | Get Sold Vehicles - Before Purchase (`GET /api/sales/vehicles/sold`) | ${{ steps.parse.outputs.get_sold_before }} |
            | Purchase Vehicle (`POST /api/sales/purchase`) | ${{ steps.parse.outputs.purchase }} |
            | Get Available Vehicles - After Purchase | ${{ steps.parse.outputs.get_available_after }} |
            | Get Sold Vehicles - After Purchase | ${{ steps.parse.outputs.get_sold_after }} |
            | Purchase - Vehicle Not Found (404) | ${{ steps.parse.outputs.purchase_not_found }} |
            | Purchase - Vehicle Not Available (400) | ${{ steps.parse.outputs.purchase_not_available }} |
            | Purchase - Validation Error (400) | ${{ steps.parse.outputs.purchase_validation }} |
            | **Payment Webhook** | |
            | Payment Webhook - Confirm (`POST /api/sales/payment/webhook`) | ${{ steps.parse.outputs.payment_confirm }} |
            | Payment Webhook - Invalid Code (404) | ${{ steps.parse.outputs.payment_invalid }} |
            
            <details>
            <summary>📋 Full Test Output</summary>
            
            ```
            ${{ steps.parse.outputs.output }}
            ```
            
            </details>
            
            ---
            *This comment will be updated on each push to the PR.*
          edit-mode: replace
